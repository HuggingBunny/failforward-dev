# failforward.dev admin, Sveltia CMS (Decap-compatible config)
#
# AUTH SETUP (one time): deploy the sveltia-cms-auth Cloudflare Worker,
# then set base_url below to the worker URL. See MAINTENANCE.md §"Admin CMS".
backend:
  name: github
  repo: HuggingBunny/failforward-dev
  branch: main
  # base_url: https://sveltia-cms-auth.<your-subdomain>.workers.dev

site_url: https://failforward.dev
media_folder: public/images
public_folder: /images

collections:
  # ── 1. Incidents & post-mortems ──────────────────────────────────────
  - name: incidents
    label: Incidents & Post-Mortems
    folder: content/incidents
    create: true
    slug: '{{slug}}'
    summary: '{{title}}, {{severity}} ({{date}})'
    fields:
      - { name: publish, label: 'Publish (guardrail, false stays private)', widget: boolean, default: false }
      - { name: title, label: Title, widget: string }
      - { name: date, label: Incident date, widget: datetime, format: 'YYYY-MM-DD', time_format: false }
      - name: category
        label: Category
        widget: select
        options: [infrastructure, security, automation, process, ai-systems, career]
      - name: severity
        label: Severity
        widget: select
        options: [sev1, sev2, sev3, lesson]
        default: lesson
      - { name: summary, label: 'One-sentence summary (card text)', widget: text }
      - { name: tags, label: Tags, widget: list, required: false }
      - name: body
        label: Post-mortem
        widget: markdown
        default: |
          ## What happened

          ...

          ## Why it happened

          - ...

          ## What was built so it can't recur

          1. ...

          > Lesson: ...

  # ── 2. Projects ──────────────────────────────────────────────────────
  - name: site-data
    label: Site Sections
    files:
      - name: projects
        label: Projects page
        file: src/data/projects.json
        fields:
          - { name: intro, label: Page intro, widget: text }
          - name: projects
            label: Project cards
            widget: list
            summary: '{{fields.title}} ({{fields.status}})'
            fields:
              - { name: href, label: 'Link (URL or /path)', widget: string }
              - { name: status, label: 'Status badge (e.g. DRAFT v0.4)', widget: string }
              - { name: title, label: Title, widget: string }
              - { name: summary, label: Summary, widget: text }
              - { name: stack, label: 'Stack line (a · b · c)', widget: string }

      # ── 3. Writing / LinkedIn series ─────────────────────────────────
      - name: writing
        label: Writing page
        file: src/data/writing.json
        fields:
          - { name: intro, label: Page intro, widget: text }
          - { name: linkedin, label: LinkedIn profile URL, widget: string }
          - name: series
            label: Series
            widget: list
            summary: 'Series {{fields.number}}, {{fields.title}} ({{fields.status}})'
            fields:
              - { name: number, label: 'Series number (01, 02…)', widget: string }
              - { name: title, label: Series title, widget: string }
              - { name: tagline, label: Tagline, widget: string }
              - name: status
                label: Status
                widget: select
                options: [LIVE, UPCOMING]
              - name: featuredPost
                label: Featured post (shown in full)
                widget: object
                required: false
                fields:
                  - { name: title, label: Title, widget: string }
                  - { name: date, label: 'Date (YYYY-MM-DD, blank if unpublished)', widget: string, required: false }
                  - { name: badge, label: 'Badge text (e.g. POST 1 · LIVE)', widget: string }
                  - { name: paragraphs, label: Paragraphs, widget: list }
              - name: posts
                label: Posts in series
                widget: list
                summary: '{{fields.n}}, {{fields.title}}'
                fields:
                  - { name: n, label: 'Post number', widget: number, value_type: int }
                  - { name: title, label: Title, widget: string }
                  - { name: slug, label: 'URL slug (kebab-case, becomes /writing/<slug>/)', widget: string }
                  - { name: hook, label: 'Hook line (card text)', widget: text }
                  - { name: body, label: 'Post body (markdown, page is created when non-empty)', widget: markdown, required: false }
                  - { name: live, label: 'Published on LinkedIn?', widget: boolean, default: false }
                  - { name: url, label: 'LinkedIn post URL (optional, profile used if blank)', widget: string, required: false }
                  - { name: date, label: 'Publish date (YYYY-MM-DD)', widget: string, required: false }

      # ── 4. AI Warning Labels ─────────────────────────────────────────
      - name: labels
        label: AI Warning Labels
        file: src/data/labels.json
        fields:
          - name: labels
            label: Hazard labels
            widget: list
            summary: '{{fields.hazardClass}}, {{fields.name}}'
            fields:
              - { name: id, label: 'ID (kebab-case, unique)', widget: string }
              - { name: name, label: Hazard name, widget: string }
              - name: shape
                label: 'Shape (GHS geometry: diamond=acute, triangle=warning, circle=mandatory, square=safe)'
                widget: select
                options: [diamond, triangle, circle, square, placard]
              - { name: icon, label: 'Icon glyph (◈ ⚠ ● ✓)', widget: string }
              - name: domain
                label: Domain
                widget: select
                options: [llm, social, emotional, autonomy, data]
              - { name: hazardClass, label: 'Hazard class (AI-Hxxx / AI-Wxxx / AI-Mxxx / AI-Cxxx)', widget: string }
              - { name: statement, label: 'Hazard statement (GHS style)', widget: text }
              - { name: precaution, label: 'Precautionary statement', widget: text }
              - { name: sourceSymbol, label: 'Adapted from (real-world symbol)', widget: string }
          - name: labelSets
            label: Product label sets
            widget: list
            summary: '{{fields.product}} (class {{fields.deploymentClass}})'
            fields:
              - { name: id, label: 'ID (kebab-case)', widget: string }
              - { name: product, label: Product name, widget: string }
              - { name: deploymentClass, label: 'Deployment risk class (1–4)', widget: number, value_type: int, min: 1, max: 4 }
              - name: trafficLight
                label: Traffic-light rating
                widget: select
                options: [green, amber, red]
              - { name: labels, label: 'Hazard label IDs (must match above)', widget: list }
              - name: panel
                label: Transparency facts panel
                widget: object
                fields:
                  - { name: modelClass, label: Model class, widget: string }
                  - name: trainingDataDisclosed
                    label: Training data disclosed
                    widget: select
                    options: [full, partial, none]
                  - { name: evalCoverage, label: 'Eval coverage (0–100)', widget: number, value_type: int, min: 0, max: 100 }
                  - name: humanOversight
                    label: Human oversight
                    widget: select
                    options: [required, available, none]
                  - name: explainability
                    label: Explainability
                    widget: select
                    options: [high, medium, low]
                  - name: biasAudit
                    label: Bias audit
                    widget: select
                    options: [passed, conditional, not-performed]
              - name: certs
                label: 'Certifications (AI-CERT, ETHI-COMP, PRI-CERT)'
                widget: list
                required: false
